$kind: http-request
url: 'http://localhost:3000/api/v1/users'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Naveen",
      "email": "naveen@example.com",
      "password": "{{signup_password}}",
      "password_confirmation": "{{signup_password}}"
    }
auth:
  type: bearer
  credentials:
    token: '{{jwt_token}}'
order: 3000
