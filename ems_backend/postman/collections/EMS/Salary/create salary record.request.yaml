$kind: http-request
url: http://localhost:3000/api/v1/salary_records
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "employee_id": 1,
      "month": 11,
      "year": 2026
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
order: 1000
